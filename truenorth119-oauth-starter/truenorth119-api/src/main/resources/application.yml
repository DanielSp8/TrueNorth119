server:
  port: 8080

spring:
  application:
    name: truenorth119-api
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/truenorth119?connectionTimeZone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://127.0.0.1:9000
          audiences: truenorth119-api
